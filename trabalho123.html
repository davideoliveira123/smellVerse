<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smell Verse - Onde histórias ganham aroma</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #7c3aed;
      --primary-dark: #6d28d9;
      --secondary: #f59e0b;
      --dark: #1e1b4b;
      --gray: #64748b;
      --light: #faf5ff;
      --white: #ffffff;
      --success: #22c55e;
      --danger: #ef4444;
      --shadow: 0 4px 20px rgba(124, 58, 237, 0.12);
      --radius: 14px;
      --transition: all 0.3s ease;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--light);
      color: var(--dark);
      line-height: 1.6;
    }

    body.no-scroll {
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      padding: 0 20px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      border: 0;
      cursor: pointer;
      font-family: inherit;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.4rem;
      font-weight: 700;
    }

    .logo img {
      width: 58px;
      height: 58px;
      object-fit: contain;
      border-radius: 8px;
    }

    .logo-text {
      color: var(--dark);
    }

    .footer .logo-text {
      color: var(--white);
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--white);
      box-shadow: var(--shadow);
    }

    .header-content {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav {
      display: flex;
      gap: 28px;
    }

    .nav-link {
      position: relative;
      color: var(--gray);
      font-weight: 500;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--primary);
    }

    .nav-link.active::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--primary);
    }

    .cart-btn {
      position: relative;
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--light);
      color: var(--dark);
      font-size: 1.15rem;
      transition: var(--transition);
    }

    .cart-btn:hover {
      background: var(--primary);
      color: var(--white);
    }

    .cart-count {
      position: absolute;
      top: -4px;
      right: -4px;
      width: 20px;
      height: 20px;
      display: none;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--danger);
      color: var(--white);
      font-size: 0.7rem;
      font-weight: 700;
    }

    .hero {
      padding: 90px 0;
      background: linear-gradient(135deg, #4c1d95, #7c3aed, #a78bfa);
      color: var(--white);
    }

    .hero-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
    }

    .hero h1 {
      margin-bottom: 18px;
      font-size: 2.9rem;
      line-height: 1.15;
    }

    .hero p {
      max-width: 480px;
      margin-bottom: 30px;
      font-size: 1.15rem;
    }

    .hero-card {
      padding: 45px 55px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.12);
      text-align: center;
      backdrop-filter: blur(12px);
      animation: float 3.5s ease-in-out infinite;
    }

    .hero-card i {
      display: block;
      margin-bottom: 14px;
      font-size: 3.2rem;
    }

    .hero-card span {
      font-size: 1.35rem;
      font-weight: 700;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-14px);
      }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 30px;
      border-radius: 10px;
      font-weight: 600;
      transition: var(--transition);
    }

    .btn-primary {
      background: var(--secondary);
      color: var(--dark);
    }

    .btn-primary:hover {
      background: #d97706;
      transform: translateY(-2px);
    }

    .btn-outline {
      border: 2px solid var(--gray);
      background: transparent;
      color: var(--gray);
    }

    .btn-outline:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    .btn-block {
      width: 100%;
      margin-top: 10px;
    }

    .btn-add {
      width: 100%;
      margin-top: 14px;
      padding: 11px;
      border-radius: 10px;
      background: var(--primary);
      color: white;
      font-weight: 600;
    }

    .btn-add:hover {
      background: var(--primary-dark);
    }

    .btn-add:disabled {
      background: var(--success);
    }

    .categories {
      padding: 32px 0;
      background: white;
    }

    .category-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .category-btn {
      padding: 11px 24px;
      border-radius: 50px;
      background: var(--light);
      color: var(--gray);
      font-weight: 500;
    }

    .category-btn:hover,
    .category-btn.active {
      background: var(--primary);
      color: var(--white);
    }

    .products,
    .offers {
      padding: 65px 0;
    }

    .offers {
      background: var(--white);
    }

    .section-header {
      margin-bottom: 42px;
      text-align: center;
    }

    .section-header h2 {
      margin-bottom: 8px;
      font-size: 2.1rem;
    }

    .section-header p {
      color: var(--gray);
    }

    .search-container {
      position: relative;
      max-width: 600px;
      margin: 0 auto 30px;
    }
